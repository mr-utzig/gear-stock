{{template "base.html"}}

{{define "title"}}Gear Stock - Login{{end}}

{{define "content"}}
<main class="flex items-center flex-1 min-h-full overflow-x-hidden">
    <div class="w-full max-w-sm mx-auto overflow-hidden bg-white rounded-lg shadow-md dark:bg-gray-800">
        <div class="px-6 py-4">
            <div class="flex justify-center mx-auto">
                <img class="w-auto h-[100px]" src="/public/img/gear-stock-v2.png"
                    alt="Gear Stock (DALL-E AI Generated Logo)">
            </div>
            <h3 class="mt-1 text-xl font-medium text-center text-gray-600 dark:text-gray-200">Gear Stock</h3>
            <p class="mt-1 text-center text-gray-500 dark:text-gray-400">Acesse sua conta</p>
            <form hx-post="/login/validate" hx-target="#snackbar-message" hx-swap="innerHTML" hx-indicator="#indicator"
                hx-disabled-elt="input, button">
                <div class="w-full mt-4">
                    <input
                        class="block w-full px-4 py-2 mt-2 text-gray-700 placeholder-gray-500 bg-white border rounded-lg dark:bg-gray-800 dark:border-gray-600 dark:placeholder-gray-400 focus:border-blue-400 dark:focus:border-blue-300 focus:ring-opacity-40 focus:outline-none focus:ring focus:ring-blue-300"
                        type="email" name="email" placeholder="Endereço de e-mail" aria-label="Endereço de e-mail"
                        required />
                </div>
                <div class="w-full mt-4">
                    <input
                        class="block w-full px-4 py-2 mt-2 text-gray-700 placeholder-gray-500 bg-white border rounded-lg dark:bg-gray-800 dark:border-gray-600 dark:placeholder-gray-400 focus:border-blue-400 dark:focus:border-blue-300 focus:ring-opacity-40 focus:outline-none focus:ring focus:ring-blue-300"
                        type="password" name="password" placeholder="Senha" aria-label="Senha" required />
                </div>
                <div class="flex items-center justify-between mt-4">
                    <!-- <a href="#" class="text-sm text-gray-600 dark:text-gray-200 hover:text-gray-500">Esqueceu da
                        senha?</a> -->
                    <button
                        class="flex-1 px-6 py-2 text-sm font-medium tracking-wide text-white capitalize transition-colors duration-300 transform bg-blue-500 rounded-lg hover:bg-blue-400 focus:outline-none focus:ring focus:ring-blue-300 focus:ring-opacity-50">
                        Entrar
                        <i id="indicator" class="fa-solid fa-gear fa-xl fa-spin htmx-indicator"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
<script>
    document.body.addEventListener("htmx:afterSwap", function (e) {
        if (e.detail.xhr.status == 200) {
            setTimeout(() => {
                location.replace("")
            }, 3000);
        }
    })
</script>
{{end}}
